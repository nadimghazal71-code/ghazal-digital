<main>

      <p class="hero-hint" id="heroWizardHint"></p>
      <p class="hero-call"><span id="heroCallPrefix"></span> <a class="btn btn-link" id="heroCallBtn" href="#contact"></a></p>
      <ul class="hero-facts" id="heroFacts"></ul>
    </div>
  </section>

  <section id="services" class="section">
    <div class="section-head">
      <span class="tag" id="servicesTag"></span>
      <h2 id="servicesHeading"></h2>
    </div>
    <div class="paths-grid" id="servicesGrid"></div>
  </section>

  <section id="work" class="section">
    <div class="section-head">
      <span class="tag" id="workTag"></span>
      <h2 id="workHeading"></h2>

  <section id="process" class="section">
    <div class="section-head">
      <span class="tag" id="processTag"></span>
      <h2 id="processHeading"></h2>
    </div>

  <section id="why" class="section">

      <span class="tag" id="whyTag"></span>
      <h2 id="whyHeading"></h2>
    </div>

  <section id="about" class="section">
    <div class="about-wrap">
      <div class="about-body">
        <span class="tag" id="aboutTag"></span>
        <h2 id="aboutHeading"></h2>
        <p class="about-text" id="aboutText"></p>
      </div>
    </div>
  </section>

  <section id="contact" class="section contact-section">
    <div class="section-head">
      <span class="tag" id="contactTag"></span>
      <h2 id="contactHeading"></h2>
      <p class="section-intro" id="contactText"></p>

        <div class="guide-banner">

          <button type="button" class="btn btn-outline" id="guideBannerBtn" data-wizard></button>

        <div id="formsWrap"></div>

      <aside class="contact-info">
        <a class="btn btn-primary call-btn" id="contactCallBtn" href="#contact"></a>
